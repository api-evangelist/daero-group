aid: daero-group
name: Daero Group
description: 'DAERO (Daero Group) is a construction-technology company building mobile-first
  tools for trades and field teams. Its flagship product, ZeroPunch, is a field-operations
  platform that turns real-time field intuition into structured construction data:
  voice-first capture lets crews speak field observations in natural language, photos
  are paired with contextual field data, work is auto-assigned by scope, and stream-of-consciousness
  notes are converted into organized daily logs. ZeroPunch offers a two-way integration
  with Procore for project-management sync. The company positions itself around the
  daily needs of the people actually doing the work, aiming to make construction operations
  smarter and faster. As of this profile DAERO publishes no public developer API,
  SDK, or developer portal; integration is partnership-level (Procore) and inquiries
  go to support@daerogroup.com. Backed by Threshold Ventures.'
